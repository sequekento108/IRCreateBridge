plugins {
    id "java-library"
    id "maven-publish"
    id "net.neoforged.moddev" version "2.0.141"
}

version = project.mod_version
group = project.mod_group

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version
    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft
    }
    runs {
        client {
            client()
            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        }
        server {
            server()
            programArgument "--nogui"
            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        }
        data {
            data()
            programArguments.addAll "--mod", project.mod_id, "--all", "--output", file("src/generated/resources/").getAbsolutePath(), "--existing", file("src/main/resources/").getAbsolutePath()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    mavenCentral()
    maven {
        url = "https://maven.neoforged.net/releases/"
    }
    maven {
        url = "https://maven.createmod.net"
    }
    maven {
        url = "https://maven.ithundxr.dev/snapshots"
    }
    maven {
        url = "https://mvn.devos.one/snapshots"
    }
    maven {
        url = "https://teamopenindustry.cc/maven"
    }
    maven {
        url = "https://maven.parchmentmc.org"
    }
    maven {
        url = "https://maven.architectury.dev/"
    }
    maven {
        url = "https://maven.squiddev.cc"
    }
    exclusiveContent {
        forRepository {
            maven {
                url = "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    implementation("net.neoforged:neoforge:${project.neoforge_version}")
    implementation("com.simibubi.create:create-${project.minecraft_version}:${project.create_version}:slim") {
        transitive = false
    }
    implementation("net.createmod.ponder:ponder-neoforge:${project.ponder_version}+mc${project.minecraft_version}")
    implementation("dev.engine-room.flywheel:flywheel-neoforge-${project.minecraft_version}:${project.flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${project.registrate_version}")
    implementation("curse.maven:track-api-282613:8246445")
    implementation("curse.maven:universal-mod-core-371784:8503905")
    implementation("curse.maven:immersive-railroading-277736:8329738")
    implementation("curse.maven:steam-n-rails-neoforge-1414670:8413883")
    implementation("org.spongepowered:mixin:${project.mixin_version}")
    annotationProcessor("org.spongepowered:mixin:${project.mixin_version}:processor")
    implementation("io.github.llamalad7:mixinextras-neoforge:${project.mixinextras_version}")
    annotationProcessor("io.github.llamalad7:mixinextras-neoforge:${project.mixinextras_version}")
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version      : project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        neo_version            : project.neoforge_version,
        neoforge_version       : project.neoforge_version,
        neoforge_version_range : project.neoforge_version_range,
        loader_version_range   : project.loader_version_range,
        mod_id                 : project.mod_id,
        mod_name               : project.mod_name,
        mod_version            : project.mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(["META-INF/neoforge.mods.toml"]) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}
