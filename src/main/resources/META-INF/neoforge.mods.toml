modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "MIT"
issueTrackerUrl = "https://example.com/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = "Allows Immersive Railroading stock on Create and Steam n Rails tracks and vice versa."

[[mixins]]
config = "ircreatebridge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "[6.0.0,7.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "trackapi"
type = "required"
versionRange = "[1.3,2.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "immersiverailroading"
type = "required"
versionRange = "[1.11.0,2.0.0)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "railways"
type = "required"
versionRange = "[0.2.0,1.0.0)"
ordering = "AFTER"
side = "BOTH"
